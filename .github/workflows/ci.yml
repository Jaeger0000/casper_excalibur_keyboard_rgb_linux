name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-ubuntu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python is ">=3.10", so test the oldest and newest
        # interpreters that claim to be supported, not just one.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb libegl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0 libxcb-cursor0
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Lint
      run: |
        make lint
    - name: Run Tests
      run: |
        xvfb-run make test

  test-archlinux:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
    - uses: actions/checkout@v4
    - name: Install system dependencies
      run: |
        pacman -Syu --noconfirm
        pacman -S --noconfirm python python-pip xorg-server-xvfb qt6-base gcc make
    - name: Create virtual environment
      run: |
        python -m venv .venv
    - name: Install Python dependencies
      run: |
        . .venv/bin/activate
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Run Tests
      run: |
        . .venv/bin/activate
        xvfb-run make test

  build-driver:
    # The DKMS module is shipped by every package; a syntax or API error in
    # it only surfaced on a user's machine at install time before this.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install kernel headers and build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential "linux-headers-$(uname -r)"
    - name: Build casper-wmi
      run: make -C driver

  release:
    needs: [test-ubuntu, test-archlinux, build-driver]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install build tools
      run: python -m pip install build

    - name: Semantic Release
      id: semantic
      uses: python-semantic-release/python-semantic-release@v10.5.3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish package distributions to GitHub Releases
      uses: python-semantic-release/publish-action@v10.5.3
      if: steps.semantic.outputs.released == 'true'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ steps.semantic.outputs.tag }}

    - name: Update PKGBUILD and .SRCINFO
      if: steps.semantic.outputs.released == 'true'
      env:
        NEW_VERSION: ${{ steps.semantic.outputs.version }}
      run: |
        ./update_pkgbuild.sh "$NEW_VERSION"

        # .SRCINFO is generated here rather than only inside the AUR repo,
        # so the copy tracked in this repository cannot drift out of sync
        # with PKGBUILD the way it did before.
        #
        # makepkg ships with pacman and is already in the base image, so no
        # packages are installed; it only refuses to run as root, hence the
        # privilege drop.  A throwaway directory is mounted so the checkout
        # is never chown'd out from under the subsequent git commands, and
        # stdout is captured on the host so the file belongs to the runner.
        mkdir -p /tmp/srcinfo
        cp PKGBUILD casper-keyboard-rgb.install /tmp/srcinfo/
        docker run --rm -v /tmp/srcinfo:/pkg -w /pkg archlinux:latest bash -c \
          'chown -R nobody /pkg && setpriv --reuid=nobody --regid=nobody --clear-groups makepkg --printsrcinfo' \
          > .SRCINFO

        # Never commit an empty or stale .SRCINFO – that is what leaves the
        # AUR package unusable.
        test -s .SRCINFO
        grep -q "pkgver = ${NEW_VERSION}$" .SRCINFO

        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add PKGBUILD .SRCINFO
        if ! git diff-index --quiet HEAD; then
          git commit -m "chore(pkgbuild): update to v$NEW_VERSION [skip ci]"
          git push origin HEAD:main
        fi

    - name: Setup SSH for AUR
      if: steps.semantic.outputs.released == 'true'
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

    - name: Prepare AUR Deployment
      if: steps.semantic.outputs.released == 'true'
      env:
        NEW_VERSION: ${{ steps.semantic.outputs.version }}
      run: |
        # Set git user
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        # Add verified AUR host key (avoids ssh-keyscan MITM risk)
        mkdir -p ~/.ssh
        echo "aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLTi0" >> ~/.ssh/known_hosts
        chmod 600 ~/.ssh/known_hosts

        # Release steps may leave tracked changes in the workspace.
        # Use the current checked-out files directly instead of rebasing here.

        # Clone AUR repo
        git clone ssh://aur@aur.archlinux.org/casper-keyboard-rgb.git aur_repo

        # Copy updated files to AUR repo.  .SRCINFO was already regenerated
        # from this PKGBUILD in the previous step, so it is copied rather
        # than built a second time.
        cp PKGBUILD casper-keyboard-rgb.install .SRCINFO aur_repo/

        # Commit and push to AUR
        cd aur_repo
        git add PKGBUILD casper-keyboard-rgb.install .SRCINFO

        # Check if there are changes
        if ! git diff-index --quiet HEAD; then
          git commit -m "Update to ${NEW_VERSION}"
          git push origin master
        else
          echo "No changes to commit to AUR"
        fi
